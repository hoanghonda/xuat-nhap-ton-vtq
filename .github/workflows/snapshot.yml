name: Lưu bản chụp tồn kho

on:
  schedule:
    - cron: '17 * * * *'   # mỗi giờ (phút 17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot.mjs
      - name: Commit nếu có thay đổi
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898733+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo 'Không có thay đổi'; exit 0; fi
          git commit -m "Bản chụp tồn kho $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
